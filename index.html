<style>
*{

/* =====================================================
   SPLASH
===================================================== */

#splashScreen{
    position:fixed;
    inset:0;
    z-index:9999999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    animation:splashAutoHide .7s ease 2.2s forwards;
}

#splashScreen img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    animation:logoPulse 1.25s ease-in-out infinite;
    box-shadow:
        0 0 25px rgba(155,0,255,.8),
        0 0 70px rgba(100,0,255,.45);
}

@keyframes logoPulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

@keyframes splashAutoHide{
    to{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}

/* =====================================================
   APP
===================================================== */

#app{
    width:100%;
    min-height:100vh;

}

/* =====================================================
   HOME HEADER
===================================================== */

.home-header{
    width:100%;

    background:rgba(255,255,255,.98);
    position:sticky;
    top:0;
    z-index:3000;
    border-bottom:1px solid #ededed;

}

.brand{

    letter-spacing:.5px;
    margin-bottom:11px;
}

.brand span{
    color:#7a00ff;
}

/* =====================================================
   HOME SEARCH
===================================================== */

.home-search-wrap{
    width:100%;
    display:flex;
    justify-content:center;
}

.home-search{
    width:calc(100% - 24px);
    max-width:680px;
    height:46px;
    display:flex;
    align-items:center;
    border:1px solid #ddd;
    background:#f7f7f7;
    border-radius:25px;
    padding-left:16px;
    padding-right:5px;
}

.home-search input{
    flex:1;
    min-width:0;
    border:0;
    outline:none;
    background:transparent;
    font-size:15px;
    color:#111;
    user-select:text;
    -webkit-user-select:text;
}

.home-search button{
    width:37px;
    height:37px;
    border:0;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-size:17px;
}

/* =====================================================
   CATEGORIES
===================================================== */

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    padding:10px 14px 9px;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;

    border:0;
    border-radius:20px;

    color:#111;
    font-size:13px;
    font-weight:700;
}

.category.active{
    background:#111;
    color:#fff;
}

/* =====================================================
   HOME VIDEO LIST
===================================================== */

#results{
    width:100%;
    padding:5px 12px 25px;
}

.video-card{
    width:100%;
    margin-bottom:18px;
    cursor:pointer;
}

.video-thumb{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;

    background:#e9e9e9;
}

.video-thumb img{

}

    overflow:hidden;
}

.video-channel{

    color:#777;
    font-size:12px;
}

/* =====================================================
   LOAD MORE
===================================================== */

#loadMore{

/* =====================================================

===================================================== */

===================================================== */

===================================================== */

.player-search-btn,

/* =====================================================

===================================================== */

<script>

/* =====================================================
   API KEY
===================================================== */

const API_KEY =
    "AIzaSyByuQ_hrEaCvAUoqdIkGyzMDWMTlzZ0zGo";

const API_URL =
    "https://www.googleapis.com/youtube/v3/search";


/* =====================================================
   ELEMENTS
===================================================== */

const splash =
    document.getElementById("splashScreen");

const app =
    document.getElementById("app");

const playerPage =
    document.getElementById("playerPage");

const results =
    document.getElementById("results");

const relatedResults =
    document.getElementById("relatedResults");

const relatedTitle =
    document.getElementById("relatedTitle");

const relatedClear =
    document.getElementById("relatedClear");

const searchInput =
    document.getElementById("searchInput");

const playerSearchInput =
    document.getElementById("playerSearchInput");

const youtubeFrame =
    document.createElement("iframe");

const fullFrameHost =
    document.getElementById("fullFrameHost");

const miniVideoHost =
    document.getElementById("miniVideoHost");

const miniPlayer =
    document.getElementById("miniPlayer");

const miniTitle =
    document.getElementById("miniTitle");

const homeDemon =
    document.getElementById("homeDemon");

const playerSearchPanel =
    document.getElementById("playerSearchPanel");


/* =====================================================
   IFRAME SETUP
===================================================== */

youtubeFrame.id =
    "youtubeFrame";

youtubeFrame.allow =
    "autoplay; encrypted-media; picture-in-picture";

youtubeFrame.allowFullscreen =
    true;

fullFrameHost.appendChild(
    youtubeFrame
);


/* =====================================================
   SPLASH
===================================================== */

function hideSplash(){

    const el =
        document.getElementById("splashScreen");

    if(!el) return;

    el.style.opacity = "0";
    el.style.visibility = "hidden";
    el.style.pointerEvents = "none";

    setTimeout(function(){

        if(el && el.parentNode){
            el.parentNode.removeChild(el);
        }

    },700);

}

setTimeout(
    hideSplash,
    2800
);

window.addEventListener(
    "load",
    function(){

        setTimeout(
            hideSplash,
            400
        );

    }
);


/* =====================================================
   STATE
===================================================== */

let nextPageToken = "";
let currentQuery = "trending music";
let loading = false;

let currentVideoId = "";
let currentVideoTitle = "";
let currentVideoThumb = "";

let playbackActive = false;
let isMiniMode = false;

let wakeLock = null;


/* =====================================================
   API CHECK
===================================================== */

function hasApiKey(){

    return (
        API_KEY &&
        API_KEY.trim() !== "" &&
        !API_KEY.includes(
            "YOUR_YOUTUBE_API_KEY"
        )
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   TITLE CLEAN
===================================================== */

function normalizeSongTitle(title){

    return String(title || "")
        .replace(
            /\b(official|video|audio|lyrics?|lyric|4k|hd|full|status|shorts?|song|songs|music)\b/gi,
            " "
        )
        .replace(
            /[^\u0980-\u09FFa-zA-Z0-9\s]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =====================================================
   YOUTUBE REQUEST
===================================================== */

async function youtubeRequest(params){

    const query = {

        key:API_KEY,

        part:"snippet",

        maxResults:
            params.maxResults || "20",

        type:"video",

        videoEmbeddable:"true",

        regionCode:"BD",

        relevanceLanguage:"bn",

        ...params

    };


    const url =
        API_URL +
        "?" +
        new URLSearchParams(query)
            .toString();


    const response =
        await fetch(url);


    const data =
        await response.json();


    if(!response.ok){

        throw new Error(
            data?.error?.message ||
            "YouTube API error"
        );

    }


    return data;

}


/* =====================================================
   ERROR
===================================================== */

function showApiError(message){

    results.innerHTML = `
        <div class="status">
            ❌ ${escapeHtml(message)}
        </div>
    `;

}


/* =====================================================
   CARD
===================================================== */

function makeCard(item){

    const videoId =
        item?.id?.videoId;

    if(!videoId){
        return null;
    }


    const title =
        item?.snippet?.title ||
        "Unknown video";


    const channel =
        item?.snippet?.channelTitle ||
        "";


    const thumb =
        item?.snippet?.thumbnails?.high?.url ||
        item?.snippet?.thumbnails?.medium?.url ||
        item?.snippet?.thumbnails?.default?.url ||
        "";


    const card =
        document.createElement("article");

    card.className =
        "video-card";


    card.innerHTML = `

        <div class="video-thumb">

            <img
                src="${escapeHtml(thumb)}"
                loading="lazy"
                alt="">

        </div>

        <div class="video-title">
            ${escapeHtml(
                normalizeSongTitle(title) ||
                title
            )}
        </div>

        <div class="video-channel">
            ${escapeHtml(channel)}
        </div>

    `;


    card.addEventListener(
        "click",
        function(){

            openPlayer(
                videoId,
                title,
                thumb
            );

        }
    );


    return card;

}


/* =====================================================
   RENDER
===================================================== */

function renderVideos(
    items,
    container,
    append=false
){

    if(!append){
        container.innerHTML = "";
    }


    let count = 0;


    for(const item of items){

        const card =
            makeCard(item);


        if(card){

            container.appendChild(card);

            count++;

        }

    }


    if(!append && count === 0){

        container.innerHTML = `
            <div class="status">
                কোনো ভিডিও পাওয়া যায়নি।
            </div>
        `;

    }

}

        );

    }


    loading = true;


    if(!nextPageToken){

        results.innerHTML = `
            <div class="status">
                Loading music...
            </div>
        `;

    }


    try{

        const data =
            await youtubeRequest({

                q:currentQuery,

                pageToken:
                    nextPageToken || ""

            });


        renderVideos(
            data.items || [],
            results,
            Boolean(nextPageToken)
        );


        nextPageToken =
            data.nextPageToken || "";


    }
    catch(error){

        console.error(error);

        showApiError(
            error.message ||
            "ভিডিও লোড করা যায়নি।"
        );

    }


    loading = false;

}

/* =====================================================
   SHUFFLE
===================================================== */

function shuffleArray(array){

    const result =
        [...array];


    for(
        let i = result.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];

    }


    return result;

}


/* =====================================================
   UNIQUE VIDEOS
===================================================== */

function uniqueVideos(items){

    const seen =
        new Set();


    /*
       বর্তমানে চলা ভিডিওটি আগে থেকেই বাদ।
    */

    if(currentVideoId){
        seen.add(currentVideoId);
    }


    const result = [];


    for(const item of items){

        const id =
            item?.id?.videoId;


        if(!id){
            continue;
        }


        if(seen.has(id)){
            continue;
        }


        seen.add(id);

        result.push(item);

    }


    return result;

}


/* =====================================================
   SMART RELATED VIDEOS
===================================================== */

async function loadRelatedVideos(query){

    if(!hasApiKey()){
        return;
    }


    relatedResults.innerHTML = `
        <div class="status">
            Finding recommendations...
        </div>
    `;


    try{

        /*
           Current video's title থেকে
           মূল recommendation keyword নেওয়া হচ্ছে।
        */

        const cleanQuery =
            normalizeSongTitle(query) ||
            query ||
            "music";


        /*
           SIMILAR / MOOD GROUP

           এই group-এর ভিডিওগুলো
           বর্তমান ভিডিওর কাছাকাছি রাখার চেষ্টা করবে।
        */

        const similarQueries = [

            cleanQuery,

            cleanQuery + " similar songs",

            cleanQuery + " related music",

            cleanQuery + " emotional song"

        ];


        /*
           MIXED GROUP

           অন্য music + viral music + shorts
        */

        const mixedQueries = [

            "trending music",

            "new music",

            "popular songs",

            "viral music",

            "music shorts",

            "viral shorts music",

            "Bangla Hindi English music"

        ];


        /*
           একসাথে request পাঠানো হচ্ছে।
        */

        const allRequests = [

            ...similarQueries.map(
                function(q){

                    return youtubeRequest({

                        q:q,

                        maxResults:"10"

                    });

                }
            ),

            ...mixedQueries.map(
                function(q){

                    return youtubeRequest({

                        q:q,

                        maxResults:"10"

                    });

                }
            )

        ];


        const responses =
            await Promise.all(
                allRequests
            );


        /*
           Similar আলাদা,
           Mixed আলাদা।
        */

        let similarItems = [];
        let mixedItems = [];


        responses.forEach(
            function(data,index){

                if(
                    index <
                    similarQueries.length
                ){

                    similarItems.push(
                        ...(data.items || [])
                    );

                }
                else{

                    mixedItems.push(
                        ...(data.items || [])
                    );

                }

            }
        );


        /*
           Duplicate বাদ।
        */

        similarItems =
            uniqueVideos(
                similarItems
            );


        mixedItems =
            uniqueVideos(
                mixedItems
            );


        /*
           Randomize।
           Refresh / নতুন player open হলে
           order পরিবর্তন হবে।
        */

        similarItems =
            shuffleArray(
                similarItems
            );


        mixedItems =
            shuffleArray(
                mixedItems
            );


        /*
           40% Similar
           60% Mixed

           5টি ভিডিওর মধ্যে:
           2টি Similar
           3টি Mixed
        */

        const finalList = [];

        let s = 0;
        let m = 0;


        while(
            finalList.length < 30 &&
            (
                s < similarItems.length ||
                m < mixedItems.length
            )
        ){

            const position =
                finalList.length % 5;


            /*
               position 0 এবং 3
               = Similar
            */

            if(
                position === 0 ||
                position === 3
            ){

                if(
                    s < similarItems.length
                ){

                    finalList.push(
                        similarItems[s++]
                    );

                }
                else if(
                    m < mixedItems.length
                ){

                    finalList.push(
                        mixedItems[m++]
                    );

                }

            }

            /*
               বাকি 3টি
               = Mixed
            */

            else{

                if(
                    m < mixedItems.length
                ){

                    finalList.push(
                        mixedItems[m++]
                    );

                }
                else if(
                    s < similarItems.length
                ){

                    finalList.push(
                        similarItems[s++]
                    );

                }

            }

        }


        /*
           Safety check:
           কোনো কারণে duplicate ঢুকে গেলে
           আবার remove।
        */

        const finalSeen =
            new Set();


        const cleanFinalList = [];


        for(
            const item of finalList
        ){

            const id =
                item?.id?.videoId;


            if(!id){
                continue;
            }


            if(
                finalSeen.has(id) ||
                id === currentVideoId
            ){

                continue;

            }


            finalSeen.add(id);

            cleanFinalList.push(item);

        }


        /*
           Render
        */

        renderVideos(
            cleanFinalList,
            relatedResults
        );


        relatedTitle.textContent =
            "Recommended For You";


    }
    catch(error){

        console.error(
            "Smart recommendation error:",
            error
        );


        relatedResults.innerHTML = `
            <div class="status">
                Related videos unavailable.
            </div>
        `;

    }

}

/* =====================================================
   WAKE LOCK
===================================================== */

async function requestWakeLock(){

    if(!("wakeLock" in navigator)){
        return;
    }


    try{

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );

    }
    catch(error){

        console.log(
            "Wake Lock unavailable"
        );

    }

}


async function releaseWakeLock(){

    if(!wakeLock){
        return;
    }


    try{

        await wakeLock.release();

    }
    catch(error){}


    wakeLock = null;

}


document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible" &&
            playbackActive
        ){

            requestWakeLock();

        }

    }
);

/* =====================================================
   DISABLE DOUBLE TAP ZOOM
===================================================== */

let lastTouchEnd = 0;

document.addEventListener(
